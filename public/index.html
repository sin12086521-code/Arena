<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Arena</title>
<style>
:root{--bg:#0b1020;--panel:#151d33;--panel2:#1c2844;--text:#f4f7ff;--muted:#9eacc9;--cyan:#62e6d5;--pink:#ff7ca8;--line:#2a3859}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#1c3150 0,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:22px}main{width:min(100%,760px)}header{display:flex;justify-content:space-between;margin-bottom:30px}.brand{font-weight:900}.brand span{color:var(--cyan)}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 10px}h1{font-size:clamp(32px,7vw,48px);margin:0 0 8px;letter-spacing:-2px}.sub,.muted{color:var(--muted)}.sub{margin:0 0 24px}.muted{font-size:13px}.card{background:linear-gradient(145deg,var(--panel),#11192c);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 60px #0003;margin-bottom:14px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}input{width:100%;background:#0c1426;border:1px solid #3a4c70;border-radius:12px;padding:13px;color:white;font:inherit;outline:none}input:focus{border-color:var(--cyan)}button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--cyan);color:#07151a}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}.field{margin-bottom:13px}.split,.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.status{min-height:22px;color:var(--yellow,#ffd166);font-size:13px;margin-top:12px}.center{text-align:center}.roomcode{font-size:32px;letter-spacing:5px;font-weight:900;color:var(--cyan);margin:5px}.player{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:14px}.player.me{border-color:#3c9e9a}.name{font-size:13px;color:var(--muted)}.score{font-size:30px;font-weight:900;margin-top:4px}.me .score{color:var(--cyan)}.opponent .score{color:var(--pink)}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.timer{font-size:25px;font-weight:900;color:#ffd166}.bar{height:7px;background:#293651;border-radius:8px;overflow:hidden;margin:12px 0 22px}.bar i{display:block;height:100%;width:100%;background:#ffd166}.question{text-align:center;font-size:clamp(48px,12vw,76px);font-weight:950;letter-spacing:-3px;margin:24px 0}.answer{display:flex;gap:9px;max-width:430px;margin:auto}.answer input{text-align:center;font-size:22px;font-weight:800}.answer button{min-width:100px}.feedback{text-align:center;min-height:28px;margin-top:12px;font-weight:800}.good{color:var(--cyan)}.bad{color:var(--pink)}.winner{font-size:38px;font-weight:950;margin:8px}.resultScores{font-size:22px;margin:18px}.rules{line-height:1.7}@media(max-width:560px){body{padding:15px}.card{padding:16px}.split{grid-template-columns:1fr}.roomcode{font-size:27px}}
</style></head><body><main>
<header><div class="brand">MENTAL <span>ARENA</span></div><div class="pill">LIVE 1 : 1</div></header>
<h1>암산 배틀</h1><p class="sub">같은 문제를 동시에 풀어라. 120초 동안 더 많은 정답을 먼저 쌓는 사람이 승리!</p>
<section class="card" id="lobby"><div class="field"><label>닉네임</label><input id="name" maxlength="12" placeholder="닉네임" value="플레이어"></div><div class="split"><div><button class="primary" id="create" style="width:100%">방 만들기</button><p class="muted">방 코드를 친구에게 공유</p></div><div><label>초대 코드</label><input id="code" maxlength="5" placeholder="ABCDE"><button class="secondary" id="join" style="width:100%;margin-top:8px">방 참가</button></div></div><div class="status" id="lobbyStatus"></div></section>
<section class="card hidden" id="waiting"><div class="center muted">친구에게 이 코드를 알려줘</div><div class="roomcode" id="roomCode">-----</div><div class="players" id="waitingPlayers"></div><p class="muted center" id="waitText">상대방 입장을 기다리는 중...</p><button class="primary" id="ready" style="width:100%" disabled>준비 완료</button><div class="status" id="waitStatus"></div></section>
<section class="card hidden" id="game"><div class="topline"><span id="questionNo">QUESTION 1</span><span class="timer" id="timer">120.0</span></div><div class="bar"><i id="timebar"></i></div><div class="players" id="gamePlayers"></div><div class="question" id="question">준비</div><form class="answer" id="answerForm"><input id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="정답"><button class="primary">제출</button></form><div class="feedback" id="feedback"></div><p class="muted center rules">양쪽에 똑같은 문제가 동시에 출제됩니다. 먼저 정답을 맞힌 사람이 1점을 얻고 다음 문제로 넘어갑니다.</p></section>
<section class="card hidden center" id="result"><div class="muted">MATCH FINISHED</div><div class="winner" id="winner">승리!</div><div class="resultScores" id="resultScores"></div><button class="primary" onclick="location.reload()">로비로 돌아가기</button></section>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let roomCode="",myId="",players=[],endsAt=0,tick=null,locked=false;
function show(id){["lobby","waiting","game","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cards(target){$(target).innerHTML=players.map(p=>`<div class="player ${p.id===myId?"me":"opponent"}"><div class="name">${esc(p.name)} ${p.id===myId?"· 나":""} ${p.ready?"✓ 준비":""}</div><div class="score">${p.score}</div></div>`).join("")}
function joinEvent(event,payload){socket.emit(event,payload,res=>{if(!res?.ok){$("lobbyStatus").textContent=res?.error||"연결 실패";return}roomCode=res.code;myId=res.playerId;$("roomCode").textContent=roomCode;$("code").value=roomCode;show("waiting")})}
$("create").onclick=()=>joinEvent("room:create",{name:$("name").value});
$("join").onclick=()=>joinEvent("room:join",{name:$("name").value,code:$("code").value});
$("ready").onclick=()=>{socket.emit("player:ready");$("ready").disabled=true;$("waitStatus").textContent="상대방의 준비를 기다리는 중..."};
socket.on("room:update",r=>{players=r.players;if(r.state==="waiting"){cards("waitingPlayers");$("ready").disabled=players.length!==2||!!players.find(p=>p.id===myId)?.ready;$("waitText").textContent=players.length===2?"두 명 모두 입장했습니다. 준비를 눌러주세요.":"상대방 입장을 기다리는 중...";show("waiting")}if(r.state==="playing")cards("gamePlayers")});
socket.on("game:start",d=>{show("game");endsAt=d.startsAt+d.seconds*1000;locked=false;clearInterval(tick);tick=setInterval(()=>{const left=Math.max(0,(endsAt-Date.now())/1000);$("timer").textContent=left.toFixed(1);$("timebar").style.width=left/d.seconds*100+"%";if(left<=0)clearInterval(tick)},50);$("answer").focus()});
socket.on("game:question",q=>{$("questionNo").textContent="QUESTION "+q.no;$("question").textContent=q.text;$("answer").value="";$("feedback").textContent="";$("feedback").className="feedback";locked=false;$("answer").focus()});
socket.on("game:point",p=>{$("feedback").textContent=p.playerId===myId?"정답! +1점":"상대가 먼저 맞혔습니다";$("feedback").className="feedback "+(p.playerId===myId?"good":"bad")});
$("answerForm").onsubmit=e=>{e.preventDefault();if(locked||!$("answer").value)return;locked=true;socket.emit("answer:submit",{value:$("answer").value},r=>{if(r?.status==="wrong"){$("feedback").textContent="오답! 다시 계산해 봐";$("feedback").className="feedback bad";locked=false;$("answer").select()}else if(r?.status==="wait")$("feedback").textContent="다음 문제를 기다리는 중"})};
socket.on("game:finished",r=>{clearInterval(tick);show("result");const mine=r.players.find(p=>p.id===myId);$("resultScores").textContent=r.players.map(p=>p.name+" "+p.score+"점").join("　vs　");$("winner").textContent=!r.winner?"무승부":r.winner===myId?"승리! 🏆":"패배"});
socket.on("connect_error",()=>$("lobbyStatus").textContent="서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해 주세요.");
</script></section></main></body></html>
